<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONNECT 在庫管理システム</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4 font-sans">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-800">CONNECT 在庫管理システム</h1>
      <p class="text-sm text-gray-500 mt-1">JANコード読み取り・商品一覧・CSV出力対応</p>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">バーコード・型式入力</h2>

      <div id="reader" class="w-full max-w-sm mx-auto mb-4 border border-gray-300 rounded overflow-hidden bg-black" style="min-height:250px;"></div>

      <p id="scanStatus" class="text-center text-sm text-gray-500 mb-4">
        カメラ起動中です。JANコードをカメラにかざしてください。
      </p>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">型式 / バーコード</label>
          <input type="text" id="itemCode" class="mt-1 block w-full rounded border-gray-300 p-2 border" placeholder="型式またはJANコード">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">商品名</label>
          <input type="text" id="itemName" class="mt-1 block w-full rounded border-gray-300 p-2 border" placeholder="例: サンプル商品A">
        </div>
      </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-lg font-semibold mb-4 text-gray-700">入出庫情報の入力</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600">入出区分</label>
          <select id="actionType" onchange="toggleClientField()" class="mt-1 block w-full rounded border-gray-300 p-2 border bg-white">
            <option value="入庫">📥 入庫（在庫を追加）</option>
            <option value="出庫">📤 出庫（在庫を減らす）</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">状態</label>
          <select id="itemStatus" class="mt-1 block w-full rounded border-gray-300 p-2 border bg-white">
            <option value="新品">✨ 新品</option>
            <option value="中古">🛠️ 中古</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600">数量</label>
          <input type="number" id="itemQty" min="1" value="1" class="mt-1 block w-full rounded border-gray-300 p-2 border">
        </div>

        <div id="clientField" class="hidden">
          <label class="block text-sm font-medium text-gray-600">顧客名（案件名）</label>
          <input type="text" id="clientName" class="mt-1 block w-full rounded border-gray-300 p-2 border" placeholder="例: 〇〇株式会社様">
        </div>
      </div>

      <button onclick="registerStock()" class="mt-6 w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded transition shadow-sm">
        在庫管理表へ反映させる
      </button>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <div class="flex border-b border-gray-200 mb-4">
        <button onclick="switchTab('tab1')" id="btn-tab1" class="py-2 px-4 font-semibold border-b-2 border-blue-600 text-blue-600">
          🕒 入出庫の履歴
        </button>
        <button onclick="switchTab('tab2')" id="btn-tab2" class="py-2 px-4 font-semibold border-b-2 border-transparent text-gray-500 hover:text-blue-600">
          📊 現在の在庫一覧
        </button>
      </div>

      <div class="mb-4 text-right">
        <button onclick="downloadStockCsv()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
          在庫一覧をCSV出力
        </button>
      </div>

      <div id="tab1" class="overflow-x-auto">
        <table class="min-w-full text-sm text-left text-gray-500">
          <thead class="text-xs text-gray-700 uppercase bg-gray-50">
            <tr>
              <th class="py-3 px-4">日付</th>
              <th class="py-3 px-4">型式</th>
              <th class="py-3 px-4">商品名</th>
              <th class="py-3 px-4">区分</th>
              <th class="py-3 px-4">状態</th>
              <th class="py-3 px-4 text-right">数量</th>
              <th class="py-3 px-4">顧客名</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>

      <div id="tab2" class="overflow-x-auto hidden">
        <table class="min-w-full text-sm text-left text-gray-500">
          <thead class="text-xs text-gray-700 uppercase bg-gray-50">
            <tr>
              <th class="py-3 px-4">型式</th>
              <th class="py-3 px-4">商品名</th>
              <th class="py-3 px-4 text-right">新品在庫数</th>
              <th class="py-3 px-4 text-right">中古在庫数</th>
              <th class="py-3 px-4 text-right">総在庫数</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
    </div>
  </div>

<script>
  const STORAGE_KEY = "connect_inventory_records_v1";

  let records = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let html5QrCode = null;
  let lastScannedCode = "";

  function saveRecords() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  }

  function escapeHtml(value) {
    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function formatDate(date) {
    return new Intl.DateTimeFormat("ja-JP", {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }

  function playBeep() {
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const audioCtx = new AudioContext();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = 880;

      gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 0.15);
    } catch (error) {
      console.error("ビープ音エラー:", error);
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    document.getElementById("itemCode").value = decodedText;
    document.getElementById("scanStatus").textContent = "読み取り成功：" + decodedText;

    if (decodedText !== lastScannedCode) {
      playBeep();
      lastScannedCode = decodedText;
    }

    console.log("JANコード読み取り成功:", decodedText, decodedResult);
  }

  function onScanFailure(errorMessage) {
    // 読み取り失敗は頻繁に発生するため、画面には出さない
  }

  function toggleClientField() {
    const actionType = document.getElementById("actionType").value;
    document.getElementById("clientField").classList.toggle("hidden", actionType !== "出庫");
  }

  function registerStock() {
    const code = document.getElementById("itemCode").value.trim();
    const name = document.getElementById("itemName").value.trim();
    const actionType = document.getElementById("actionType").value;
    const status = document.getElementById("itemStatus").value;
    const qty = Number(document.getElementById("itemQty").value);
    const clientName = document.getElementById("clientName").value.trim();

    if (!code) {
      alert("型式 / バーコードを入力してください。");
      return;
    }

    if (!qty || qty <= 0) {
      alert("数量は1以上で入力してください。");
      return;
    }

    records.push({
      date: formatDate(new Date()),
      code,
      name,
      actionType,
      status,
      qty,
      clientName: actionType === "出庫" ? clientName : ""
    });

    saveRecords();
    renderTables();

    document.getElementById("itemQty").value = 1;
    document.getElementById("clientName").value = "";
  }

  function getStockSummary() {
    const stockMap = {};

    records.forEach(record => {
      if (!stockMap[record.code]) {
        stockMap[record.code] = {
          code: record.code,
          name: record.name || "",
          newStock: 0,
          usedStock: 0
        };
      }

      if (record.name) {
        stockMap[record.code].name = record.name;
      }

      const diff = record.actionType === "入庫" ? record.qty : -record.qty;

      if (record.status === "新品") {
        stockMap[record.code].newStock += diff;
      } else {
        stockMap[record.code].usedStock += diff;
      }
    });

    return Object.values(stockMap).map(item => ({
      ...item,
      total: item.newStock + item.usedStock
    }));
  }

  function renderTables() {
    const logBody = document.getElementById("logTableBody");
    const stockBody = document.getElementById("stockTableBody");

    logBody.innerHTML = "";
    stockBody.innerHTML = "";

    if (records.length === 0) {
      logBody.innerHTML = `
        <tr>
          <td colspan="7" class="py-4 px-4 text-center text-gray-400">
            履歴はまだありません
          </td>
        </tr>
      `;
    } else {
      [...records].reverse().forEach(record => {
        logBody.innerHTML += `
          <tr class="bg-white">
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(record.date)}</td>
            <td class="py-3 px-4 whitespace-nowrap font-semibold">${escapeHtml(record.code)}</td>
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(record.name)}</td>
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(record.actionType)}</td>
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(record.status)}</td>
            <td class="py-3 px-4 text-right">${record.qty}</td>
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(record.clientName || "-")}</td>
          </tr>
        `;
      });
    }

    const stockSummary = getStockSummary();

    if (stockSummary.length === 0) {
      stockBody.innerHTML = `
        <tr>
          <td colspan="5" class="py-4 px-4 text-center text-gray-400">
            在庫はまだありません
          </td>
        </tr>
      `;
    } else {
      stockSummary.forEach(item => {
        stockBody.innerHTML += `
          <tr class="bg-white">
            <td class="py-3 px-4 whitespace-nowrap font-semibold">${escapeHtml(item.code)}</td>
            <td class="py-3 px-4 whitespace-nowrap">${escapeHtml(item.name)}</td>
            <td class="py-3 px-4 text-right">${item.newStock}</td>
            <td class="py-3 px-4 text-right">${item.usedStock}</td>
            <td class="py-3 px-4 text-right font-bold">${item.total}</td>
          </tr>
        `;
      });
    }
  }

  function switchTab(tabId) {
    const tab1 = document.getElementById("tab1");
    const tab2 = document.getElementById("tab2");
    const btn1 = document.getElementById("btn-tab1");
    const btn2 = document.getElementById("btn-tab2");

    tab1.classList.toggle("hidden", tabId !== "tab1");
    tab2.classList.toggle("hidden", tabId !== "tab2");

    if (tabId === "tab1") {
      btn1.className = "py-2 px-4 font-semibold border-b-2 border-blue-600 text-blue-600";
      btn2.className = "py-2 px-4 font-semibold border-b-2 border-transparent text-gray-500 hover:text-blue-600";
    } else {
      btn2.className = "py-2 px-4 font-semibold border-b-2 border-blue-600 text-blue-600";
      btn1.className = "py-2 px-4 font-semibold border-b-2 border-transparent text-gray-500 hover:text-blue-600";
    }
  }

  function downloadStockCsv() {
    const rows = [
      ["型式", "商品名", "新品在庫数", "中古在庫数", "総在庫数"],
      ...getStockSummary().map(item => [
        item.code,
        item.name,
        item.newStock,
        item.usedStock,
        item.total
      ])
    ];

    const csv = rows.map(row =>
      row.map(value => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")
    ).join("\n");

    const blob = new Blob(["\uFEFF" + csv], {
      type: "text/csv;charset=utf-8;"
    });

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");

    a.href = url;
    a.download = "在庫一覧.csv";
    a.click();

    URL.revokeObjectURL(url);
  }

  function getSafeScanConfig() {
    return {
      fps: 10,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const width = Math.min(280, viewfinderWidth * 0.85);
        const height = Math.min(120, viewfinderHeight * 0.35);
        return {
          width: Math.floor(width),
          height: Math.floor(height)
        };
      },
      aspectRatio: 1.777,
      disableFlip: true
    };
  }

  function startCameraSafely() {
    if (!window.Html5Qrcode) {
      console.error("html5-qrcodeライブラリが読み込まれていません。");
      document.getElementById("scanStatus").textContent = "カメラ読み取りライブラリを読み込めませんでした。";
      return;
    }

    html5QrCode = new Html5Qrcode("reader");

    const cameraConfig = {
      facingMode: "environment"
    };

    const scanConfig = getSafeScanConfig();

    html5QrCode.start(
      cameraConfig,
      scanConfig,
      onScanSuccess,
      onScanFailure
    ).then(() => {
      document.getElementById("scanStatus").textContent = "カメラ起動中です。JANコードを横長の枠内に合わせてください。";
      console.log("カメラ起動成功");
    }).catch(error => {
      console.error("カメラ初期化エラー:", error);
      document.getElementById("scanStatus").textContent = "カメラを起動できませんでした。HTTPS環境またはSafari/Chromeで開いてください。";
    });
  }

  window.addEventListener("load", () => {
    renderTables();
    toggleClientField();

    setTimeout(() => {
      startCameraSafely();
    }, 500);
  });

  window.addEventListener("beforeunload", async () => {
    try {
      if (html5QrCode) {
        await html5QrCode.stop();
        await html5QrCode.clear();
      }
    } catch (error) {
      console.error("カメラ停止エラー:", error);
    }
  });
</script>
</body>
</html>
