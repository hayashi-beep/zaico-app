<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CONNECT 在庫管理システム</title>

  <meta name="application-name" content="CONNECT 在庫管理" />
  <meta name="apple-mobile-web-app-title" content="CONNECT" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#2563eb" />

  <link rel="icon" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    html, body {
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }
  </style>
</head>

<body class="bg-slate-100 text-slate-800">
<main class="max-w-6xl mx-auto p-4 pb-24">
  <header class="mb-5">
    <h1 class="text-2xl font-bold">CONNECT 在庫管理システム</h1>
    <p id="syncStatus" class="text-sm text-slate-500 mt-1">Googleスプレッドシート同期対応</p>
  </header>

  <section class="bg-white rounded-2xl shadow p-4 mb-5">
    <h2 id="formTitle" class="text-lg font-bold mb-4">在庫登録</h2>
    <input id="editingId" type="hidden" />

    <div class="grid gap-4">
      <div>
        <label class="block text-sm font-semibold mb-1">型式 / JANコード</label>
        <input id="itemCode" type="text" placeholder="型式またはJANコード"
          class="w-full rounded-xl border px-4 py-3 text-base" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <button id="startScanBtn" class="rounded-xl bg-blue-600 text-white py-3 font-bold">
          カメラで読み取る
        </button>

        <button id="takePhotoBtn" class="rounded-xl bg-indigo-600 text-white py-3 font-bold">
          カメラで写真を撮る
        </button>

        <button id="stopScanBtn" class="rounded-xl bg-slate-600 text-white py-3 font-bold hidden">
          読み取り停止
        </button>
      </div>

      <input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden" />

      <div id="readerWrapper" class="hidden">
        <p id="cameraStatus" class="text-xs text-slate-500 mb-2">
          JANコードを横長の枠内に合わせてください。
        </p>
        <div id="reader" class="rounded-xl overflow-hidden border"></div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-semibold mb-1">入出区分</label>
          <select id="typeSelect" class="w-full rounded-xl border px-4 py-3 bg-white">
            <option value="入庫">入庫（在庫を追加）</option>
            <option value="出庫">出庫（在庫を減らす）</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">状態</label>
          <select id="conditionSelect" class="w-full rounded-xl border px-4 py-3 bg-white">
            <option value="新品">新品</option>
            <option value="中古">中古</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold mb-1">数量</label>
        <input id="quantityInput" type="number" min="1" value="1"
          class="w-full rounded-xl border px-4 py-3 text-base" />
      </div>

      <div id="customerField" class="hidden">
        <label class="block text-sm font-semibold mb-1">顧客名 / 案件名</label>
        <input id="customerInput" type="text" class="w-full rounded-xl border px-4 py-3 text-base" />
      </div>

      <div class="flex gap-3">
        <button id="registerBtn" class="w-32 rounded-xl bg-emerald-600 text-white py-3 font-bold">
          登録
        </button>

        <button id="cancelEditBtn" class="w-40 rounded-xl bg-slate-500 text-white py-3 font-bold hidden">
          編集をキャンセル
        </button>
      </div>
    </div>
  </section>

  <section class="bg-white rounded-2xl shadow p-4 mb-5">
    <button id="productAccordionBtn"
      class="w-full flex items-center justify-between rounded-xl bg-indigo-600 text-white py-3 px-4 font-bold">
      <span>商品一覧</span>
      <span id="productAccordionIcon">▼</span>
    </button>

    <div id="productAccordionContent" class="hidden mt-4">
      <div class="grid md:grid-cols-4 gap-3 mb-3">
        <select id="categoryInput" class="rounded-xl border px-4 py-3 bg-white"></select>
        <input id="makerInput" placeholder="メーカー名" class="rounded-xl border px-4 py-3" />
        <input id="modelInput" placeholder="型式" class="rounded-xl border px-4 py-3" />
        <input id="janInput" placeholder="JANコード" class="rounded-xl border px-4 py-3" />
      </div>

      <div class="grid md:grid-cols-2 gap-3 mb-3">
        <input id="newCategoryInput" placeholder="追加するカテゴリ名" class="rounded-xl border px-4 py-3" />
        <button id="addCategoryBtn" class="rounded-xl bg-slate-700 text-white py-3 font-bold">
          カテゴリを追加
        </button>
      </div>

      <button id="addProductBtn" class="w-full rounded-xl bg-indigo-600 text-white py-3 font-bold mb-3">
        商品一覧に登録
      </button>

      <label class="block text-sm font-semibold mb-1">CSVファイル読み込み</label>
      <input id="csvInput" type="file" accept=".csv,text/csv"
        class="w-full rounded-xl border px-4 py-3 bg-white mb-2" />

      <p class="text-xs text-slate-500 mb-4">
        CSV形式：カテゴリ,メーカー名,型式,JANコード
      </p>

      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100">
            <tr>
              <th class="p-2 text-left">カテゴリ</th>
              <th class="p-2 text-left">メーカー名</th>
              <th class="p-2 text-left">型式</th>
              <th class="p-2 text-left">JANコード</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="productBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="bg-white rounded-2xl shadow p-4">
    <div class="flex gap-2 mb-4">
      <button id="historyTab" class="flex-1 rounded-xl bg-blue-600 text-white py-3 font-bold">入出庫の履歴</button>
      <button id="stockTab" class="flex-1 rounded-xl bg-slate-200 text-slate-700 py-3 font-bold">在庫管理表</button>
    </div>

    <button id="exportBtn" class="w-full rounded-xl bg-emerald-600 text-white py-3 font-bold mb-4">
      出力
    </button>

    <div id="historyArea">
      <div id="historyCards" class="grid gap-3 md:hidden"></div>

      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100">
            <tr>
              <th class="p-2 text-left">日付</th>
              <th class="p-2 text-left">カテゴリ</th>
              <th class="p-2 text-left">メーカー名</th>
              <th class="p-2 text-left">型式</th>
              <th class="p-2 text-left">JANコード</th>
              <th class="p-2 text-left">区分</th>
              <th class="p-2 text-left">状態</th>
              <th class="p-2 text-right">数量</th>
              <th class="p-2 text-left">顧客名</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>

    <div id="stockArea" class="hidden">
      <div id="stockCards" class="grid gap-3 md:hidden"></div>

      <div class="hidden md:block overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="bg-slate-100">
            <tr>
              <th class="p-2 text-left">カテゴリ</th>
              <th class="p-2 text-left">メーカー名</th>
              <th class="p-2 text-left">型式</th>
              <th class="p-2 text-left">JANコード</th>
              <th class="p-2 text-right">新品在庫数</th>
              <th class="p-2 text-right">中古在庫数</th>
              <th class="p-2 text-right">総在庫数</th>
            </tr>
          </thead>
          <tbody id="stockBody"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxOo1NgoxE5elZ5Eq4Va0WNuSXIE5P7HL7vLwXk5hLwDT6YYc_Zy2sGfN-BYLNapkkD/exec";

const DEFAULT_CATEGORIES = [
  "HUB", "ルーター", "AP", "カメラ", "wi-fi", "電話機",
  "PoEインジェクター", "PBX関連", "その他備品"
];

let records = [];
let products = [];
let categories = [...DEFAULT_CATEGORIES];
let activeTab = "history";

let html5QrCode = null;
let isScanning = false;
let isSaving = false;

const $ = id => document.getElementById(id);

function setSyncStatus(text) {
  $("syncStatus").textContent = text;
}

function normalizeProducts(list) {
  return (Array.isArray(list) ? list : []).map(product => ({
    id: product.id || String(Date.now() + Math.random()),
    category: product.category || "",
    maker: product.maker || "",
    model: product.model || "",
    janCode: product.janCode || product.barcode || product.code || ""
  }));
}

async function loadDataFromGas() {
  try {
    setSyncStatus("スプレッドシートから読み込み中...");

    const response = await fetch(GAS_URL, {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    records = Array.isArray(data.records) ? data.records : [];
    products = normalizeProducts(data.products);
    categories = Array.isArray(data.categories) && data.categories.length > 0
      ? data.categories
      : [...DEFAULT_CATEGORIES];

    setSyncStatus("同期済み");
    renderAll();
  } catch (error) {
    console.error("GAS読み込みエラー:", error);
    setSyncStatus("同期エラー：GAS URLや公開設定を確認してください");
    renderAll();
  }
}

async function saveAllData() {
  try {
    isSaving = true;
    setSyncStatus("保存中...");

    const payload = {
      records,
      products,
      categories,
      updatedAt: new Date().toISOString()
    };

    const formData = new FormData();
    formData.append("json", JSON.stringify(payload));

    await fetch(GAS_URL, {
      method: "POST",
      body: formData
    });

    setSyncStatus("保存済み");
  } catch (error) {
    console.error("GAS保存エラー:", error);
    setSyncStatus("保存エラー");
  } finally {
    isSaving = false;
  }
}

function saveRecords() {
  return saveAllData();
}

function saveProducts() {
  return saveAllData();
}

function saveCategories() {
  return saveAllData();
}

async function refreshFromGasQuietly() {
  if (isSaving || isScanning) return;

  try {
    const response = await fetch(GAS_URL, {
      method: "GET",
      cache: "no-store"
    });

    const data = await response.json();

    records = Array.isArray(data.records) ? data.records : [];
    products = normalizeProducts(data.products);
    categories = Array.isArray(data.categories) && data.categories.length > 0
      ? data.categories
      : [...DEFAULT_CATEGORIES];

    renderAll();
    setSyncStatus("同期済み");
  } catch (error) {
    console.error("自動同期エラー:", error);
  }
}

function getJanFormatsToSupport() {
  if (typeof Html5QrcodeSupportedFormats !== "undefined") {
    return [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8
    ];
  }

  return null;
}

function onScanSuccess(decodedText, decodedResult) {
  $("itemCode").value = decodedText;
  $("cameraStatus").textContent = `読み取り成功：${decodedText}`;
  console.log("JAN読取成功:", decodedText, decodedResult);
}

function onScanFailure(errorMessage) {
}

function escapeHtml(value) {
  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function formatDate(date) {
  return new Intl.DateTimeFormat("ja-JP", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit"
  }).format(date);
}

function updateCustomerField() {
  $("customerField").classList.toggle("hidden", $("typeSelect").value !== "出庫");
}

function findProduct(value) {
  const keyword = String(value || "").trim();

  return products.find(product =>
    product.model === keyword ||
    product.janCode === keyword
  );
}

function getProductInfo(value) {
  const product = findProduct(value);

  if (product) {
    return {
      category: product.category || "",
      maker: product.maker || "",
      model: product.model || "",
      janCode: product.janCode || "",
      key: product.id
    };
  }

  return {
    category: "",
    maker: "",
    model: value || "",
    janCode: "",
    key: value || ""
  };
}

function getStockKey(value) {
  const product = findProduct(value);
  return product ? product.id : value;
}

function renderCategoryOptions() {
  const select = $("categoryInput");
  select.innerHTML = "";

  categories.forEach(category => {
    const option = document.createElement("option");
    option.value = category;
    option.textContent = category;
    select.appendChild(option);
  });
}

function addCategory(category) {
  const value = String(category || "").trim();
  if (!value) return;

  if (!categories.includes(value)) {
    categories.push(value);
  }
}

function resetForm() {
  $("editingId").value = "";
  $("formTitle").textContent = "在庫登録";
  $("registerBtn").textContent = "登録";
  $("cancelEditBtn").classList.add("hidden");

  $("itemCode").value = "";
  $("typeSelect").value = "入庫";
  $("conditionSelect").value = "新品";
  $("quantityInput").value = 1;
  $("customerInput").value = "";
  updateCustomerField();
}

function getStockList() {
  const map = {};

  records.forEach(record => {
    const info = getProductInfo(record.code);
    const stockKey = getStockKey(record.code);

    if (!map[stockKey]) {
      map[stockKey] = {
        category: info.category,
        maker: info.maker,
        model: info.model,
        janCode: info.janCode,
        newStock: 0,
        usedStock: 0
      };
    }

    const diff = record.type === "入庫" ? record.quantity : -record.quantity;

    if (record.condition === "新品") map[stockKey].newStock += diff;
    if (record.condition === "中古") map[stockKey].usedStock += diff;
  });

  return Object.values(map).map(stock => ({
    ...stock,
    total: stock.newStock + stock.usedStock
  }));
}

function renderProducts() {
  const body = $("productBody");
  body.innerHTML = "";

  if (products.length === 0) {
    body.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">商品一覧はまだありません</td></tr>`;
    return;
  }

  products.forEach(product => {
    body.innerHTML += `
      <tr class="border-b">
        <td class="p-2">${escapeHtml(product.category)}</td>
        <td class="p-2">${escapeHtml(product.maker)}</td>
        <td class="p-2 font-semibold">${escapeHtml(product.model)}</td>
        <td class="p-2">${escapeHtml(product.janCode)}</td>
        <td class="p-2 text-center">
          <button onclick="deleteProduct('${product.id}')" class="rounded-lg bg-red-600 text-white px-3 py-2 text-xs font-bold">
            削除
          </button>
        </td>
      </tr>
    `;
  });
}

function renderHistory() {
  const body = $("historyBody");
  const cards = $("historyCards");

  body.innerHTML = "";
  cards.innerHTML = "";

  if (records.length === 0) {
    body.innerHTML = `<tr><td colspan="10" class="p-4 text-center text-slate-400">履歴はまだありません</td></tr>`;
    cards.innerHTML = `<div class="p-4 text-center text-slate-400 border rounded-xl">履歴はまだありません</div>`;
    return;
  }

  [...records].reverse().forEach(record => {
    const info = getProductInfo(record.code);

    body.innerHTML += `
      <tr class="border-b">
        <td class="p-2 whitespace-nowrap">${escapeHtml(record.date)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(info.category)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(info.maker)}</td>
        <td class="p-2 whitespace-nowrap font-semibold">${escapeHtml(info.model)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(info.janCode)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(record.type)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(record.condition)}</td>
        <td class="p-2 text-right">${record.quantity}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(record.customerName || "-")}</td>
        <td class="p-2 whitespace-nowrap text-center">
          <button onclick="editRecord('${record.id}')" class="rounded-lg bg-blue-600 text-white px-3 py-2 text-xs font-bold">編集</button>
          <button onclick="deleteRecord('${record.id}')" class="rounded-lg bg-red-600 text-white px-3 py-2 text-xs font-bold">削除</button>
        </td>
      </tr>
    `;

    cards.innerHTML += `
      <div class="rounded-xl border border-slate-200 p-3 bg-white">
        <div class="flex justify-between gap-3 mb-2">
          <div class="font-bold text-base">${escapeHtml(info.model || record.code)}</div>
          <div class="text-xs text-slate-500">${escapeHtml(record.date)}</div>
        </div>

        <div class="grid grid-cols-2 gap-2 text-sm">
          <div><span class="text-slate-400">JANコード</span><br>${escapeHtml(info.janCode || "-")}</div>
          <div><span class="text-slate-400">カテゴリ</span><br>${escapeHtml(info.category || "-")}</div>
          <div><span class="text-slate-400">メーカー</span><br>${escapeHtml(info.maker || "-")}</div>
          <div><span class="text-slate-400">区分</span><br>${escapeHtml(record.type)}</div>
          <div><span class="text-slate-400">状態</span><br>${escapeHtml(record.condition)}</div>
          <div><span class="text-slate-400">数量</span><br>${record.quantity}</div>
          <div><span class="text-slate-400">顧客名</span><br>${escapeHtml(record.customerName || "-")}</div>
        </div>

        <div class="flex gap-2 mt-3">
          <button onclick="editRecord('${record.id}')" class="flex-1 rounded-lg bg-blue-600 text-white py-2 text-sm font-bold">編集</button>
          <button onclick="deleteRecord('${record.id}')" class="flex-1 rounded-lg bg-red-600 text-white py-2 text-sm font-bold">削除</button>
        </div>
      </div>
    `;
  });
}

function renderStock() {
  const body = $("stockBody");
  const cards = $("stockCards");
  const stocks = getStockList();

  body.innerHTML = "";
  cards.innerHTML = "";

  if (stocks.length === 0) {
    body.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">在庫はまだありません</td></tr>`;
    cards.innerHTML = `<div class="p-4 text-center text-slate-400 border rounded-xl">在庫はまだありません</div>`;
    return;
  }

  stocks.forEach(stock => {
    body.innerHTML += `
      <tr class="border-b">
        <td class="p-2 whitespace-nowrap">${escapeHtml(stock.category)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(stock.maker)}</td>
        <td class="p-2 whitespace-nowrap font-semibold">${escapeHtml(stock.model)}</td>
        <td class="p-2 whitespace-nowrap">${escapeHtml(stock.janCode)}</td>
        <td class="p-2 text-right">${stock.newStock}</td>
        <td class="p-2 text-right">${stock.usedStock}</td>
        <td class="p-2 text-right font-bold">${stock.total}</td>
      </tr>
    `;

    cards.innerHTML += `
      <div class="rounded-xl border border-slate-200 p-3 bg-white">
        <div class="font-bold text-base mb-2">${escapeHtml(stock.model)}</div>

        <div class="grid grid-cols-2 gap-2 text-sm mb-3">
          <div><span class="text-slate-400">JANコード</span><br>${escapeHtml(stock.janCode || "-")}</div>
          <div><span class="text-slate-400">カテゴリ</span><br>${escapeHtml(stock.category || "-")}</div>
          <div><span class="text-slate-400">メーカー</span><br>${escapeHtml(stock.maker || "-")}</div>
        </div>

        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="rounded-lg bg-slate-100 p-2">
            <div class="text-xs text-slate-500">新品</div>
            <div class="font-bold">${stock.newStock}</div>
          </div>
          <div class="rounded-lg bg-slate-100 p-2">
            <div class="text-xs text-slate-500">中古</div>
            <div class="font-bold">${stock.usedStock}</div>
          </div>
          <div class="rounded-lg bg-blue-100 p-2">
            <div class="text-xs text-blue-600">総数</div>
            <div class="font-bold text-blue-700">${stock.total}</div>
          </div>
        </div>
      </div>
    `;
  });
}

function renderAll() {
  renderCategoryOptions();
  renderProducts();
  renderHistory();
  renderStock();
}

function addOrUpdateProduct(category, maker, model, janCode) {
  addCategory(category);

  const existing = products.find(product =>
    product.model === model ||
    product.janCode === janCode
  );

  if (existing) {
    existing.category = category;
    existing.maker = maker;
    existing.model = model;
    existing.janCode = janCode;
  } else {
    products.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      category,
      maker,
      model,
      janCode
    });
  }
}

$("productAccordionBtn").addEventListener("click", () => {
  const content = $("productAccordionContent");
  const isClosed = content.classList.contains("hidden");

  content.classList.toggle("hidden", !isClosed);
  $("productAccordionIcon").textContent = isClosed ? "▲" : "▼";
});

$("addCategoryBtn").addEventListener("click", async () => {
  const category = $("newCategoryInput").value.trim();

  if (!category) return;

  addCategory(category);
  renderCategoryOptions();
  $("categoryInput").value = category;
  $("newCategoryInput").value = "";

  await saveCategories();
});

$("addProductBtn").addEventListener("click", async () => {
  const category = $("categoryInput").value;
  const maker = $("makerInput").value.trim();
  const model = $("modelInput").value.trim();
  const janCode = $("janInput").value.trim();

  $("modelInput").value = "";
  $("janInput").value = "";

  await saveProducts();
});

}

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let inQuotes = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const nextChar = text[i + 1];

    if (char === '"' && inQuotes && nextChar === '"') {
      value += '"';
      i++;
    } else if (char === '"') {
      inQuotes = !inQuotes;
    } else if (char === "," && !inQuotes) {
      row.push(value.trim());
      value = "";
    } else if ((char === "\n" || char === "\r") && !inQuotes) {
      if (char === "\r" && nextChar === "\n") i++;
      row.push(value.trim());
      if (row.some(cell => cell !== "")) rows.push(row);
      row = [];
      value = "";
    } else {
      value += char;
    }
  }

  row.push(value.trim());
  if (row.some(cell => cell !== "")) rows.push(row);

  return rows.map(row => row.map(cell => cell.replace(/^"|"$/g, "")));
}

async function readCsvFile(file) {
  const buffer = await file.arrayBuffer();
  const utf8Text = new TextDecoder("utf-8", { fatal: false }).decode(buffer);
  const garbled = (utf8Text.match(/ /g) || []).length > 0;

  if (!garbled) return utf8Text;

  try {
    return new TextDecoder("shift_jis", { fatal: false }).decode(buffer);
  } catch {
    return utf8Text;
  }
}

$("csvInput").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  try {
    const text = await readCsvFile(file);
    const rows = parseCSV(text);

    const first = rows[0]?.join(",") || "";
    const hasHeader =
      first.includes("カテゴリ") ||
      first.includes("メーカー") ||
      first.includes("型式") ||
      first.includes("JANコード");

    const dataRows = hasHeader ? rows.slice(1) : rows;

    dataRows.forEach(row => {
      const [category, maker, model, janCode] = row;
      if (category && model) {
        addOrUpdateProduct(category, maker || "", model, janCode || "");
      }
    });

    renderAll();
    await saveAllData();
  } catch (error) {
    console.error("CSV読み込みエラー:", error);
  } finally {
    event.target.value = "";
  }
});

  const type = $("typeSelect").value;
  const condition = $("conditionSelect").value;

  const customerName = $("customerInput").value.trim();

  if (!code || !quantity || quantity <= 0) return;

    records = records.map(record => record.id === $("editingId").value ? {
      ...record,
      code,
      type,
      condition,
      quantity,
      customerName: type === "出庫" ? customerName : ""
    } : record);
  } else {
    records.push({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
      date: formatDate(new Date()),
      code,
      type,
      condition,
      quantity,
      customerName: type === "出庫" ? customerName : ""

function downloadCSV(filename, rows) {
  const csv = rows.map(row =>
    row.map(value => `"${String(value ?? "").replaceAll('"', '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

      return [

        record.type,
        record.condition,

  ];

}

function exportStock() {

$("startScanBtn").addEventListener("click", async () => {
  if (isScanning) return;

  $("readerWrapper").classList.remove("hidden");
  $("startScanBtn").classList.add("hidden");
  $("stopScanBtn").classList.remove("hidden");
  $("cameraStatus").textContent = "JANコードを横長の枠内に合わせてください。";

  try {
    html5QrCode = new Html5Qrcode("reader");

    const formats = getJanFormatsToSupport();

    const config = {
      fps: 15,
      qrbox: {
        width: 280,
        height: 120
      },
      aspectRatio: 1.777,
      disableFlip: true
    };

    if (formats) {
      config.formatsToSupport = formats;
    }

    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScanSuccess,
      onScanFailure
    );

    isScanning = true;
  } catch (error) {
    console.error("カメラ起動エラー:", error);

    $("readerWrapper").classList.add("hidden");
    $("startScanBtn").classList.remove("hidden");
    $("stopScanBtn").classList.add("hidden");

    html5QrCode = null;
    isScanning = false;
  }
});

$("takePhotoBtn").addEventListener("click", () => {
  $("photoInput").click();
});

$("photoInput").addEventListener("change", async event => {
  const file = event.target.files[0];
  if (!file) return;

  let imageScanner = null;

  try {
    $("readerWrapper").classList.remove("hidden");

    imageScanner = new Html5Qrcode("reader");
    const result = await imageScanner.scanFile(file, true);

    $("itemCode").value = result;
    $("cameraStatus").textContent = `読み取り成功：${result}`;
  } catch (error) {
    console.error("写真からの読み取りエラー:", error);
  } finally {
    try {
      if (imageScanner) await imageScanner.clear();
    } catch (error) {
      console.error("imageScanner clear error:", error);
    }

    $("readerWrapper").classList.add("hidden");
    event.target.value = "";
  }
});

$("stopScanBtn").addEventListener("click", stopScanner);

async function stopScanner() {
  try {
    if (html5QrCode && isScanning) {
      await html5QrCode.stop();
      await html5QrCode.clear();
    }
  } catch (error) {
    console.error("停止エラー:", error);
  }

  html5QrCode = null;
  isScanning = false;

  $("readerWrapper").classList.add("hidden");
  $("startScanBtn").classList.remove("hidden");
  $("stopScanBtn").classList.add("hidden");
}
